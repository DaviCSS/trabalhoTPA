name: Java - compilacao e estruturas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compilacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar programa de agenda e estruturas
        run: javac -encoding UTF-8 -d build agenda/*.java estruturas/*.java testes/*.java
      - name: Testar lista e fila próprias
        run: java -cp build testes.TesteEstruturas
      - name: Verificar menu da agenda
        run: printf '1\n7\n' | java -cp build agenda.Main
